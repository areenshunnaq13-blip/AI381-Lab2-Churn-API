
name: Train, Gate and Ship Model

on:
  workflow_dispatch:
  push:
    paths:
      - "src/train/**"
      - "churn_v2.csv"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/train.yml"

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: mlflow-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    name: Train and Apply Promotion Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Find the latest previous run that saved MLflow state
      - name: Find previous MLflow state
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "train.yml",
              branch: branch,
              status: "completed",
              per_page: 20
            });

            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;

              const result =
                await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100
                });

              const artifact = result.data.artifacts.find(
                item => item.name === "mlflow-state" && !item.expired
              );

              if (artifact) {
                core.setOutput("run_id", String(run.id));
                core.info(`Found MLflow state in run ${run.id}`);
                return;
              }
            }

            core.setOutput("run_id", "");
            core.info("No previous MLflow state found. Starting fresh.");

      # Restore the database and artifacts from the previous run
      - name: Restore previous MLflow state
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: mlflow-state
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Show restored MLflow state
        run: |
          echo "Checking restored files..."
          ls -lah mlflow.db || true
          ls -lah mlartifacts || true

      # Start MLflow with persistent state restored
      - name: Start MLflow server
        run: |
          mkdir -p mlartifacts

          mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root file://$GITHUB_WORKSPACE/mlartifacts \
            > mlflow.log 2>&1 &

          echo "MLFLOW_PID=$!" >> "$GITHUB_ENV"

          READY=0

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "MLflow server is ready."
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "MLflow server failed to start."
            cat mlflow.log
            exit 1
          fi

      - name: Train models and apply promotion gate
        run: python src/train/train.py
        env:
          GITHUB_SHA: ${{ github.sha }}
          FAIL_ON_PROMOTION_REJECTION: "true"

      # This step runs even when the promotion gate rejects a model
      - name: Stop MLflow server
        if: always()
        run: |
          if [ -n "${MLFLOW_PID:-}" ]; then
            kill "$MLFLOW_PID" || true
            wait "$MLFLOW_PID" 2>/dev/null || true
          fi

      # Preserve the updated database, including rejected candidates
      - name: Save MLflow state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-state
          path: |
            mlflow.db
            mlartifacts/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      # The following steps run only if training and promotion succeeded
      - name: Extract lineage information
        id: lineage
        run: |
          python - <<'PY'
          import json
          import os

          with open("lineage.json", encoding="utf-8") as file:
              lineage = json.load(file)

          if not lineage["promoted"]:
              raise SystemExit("Promotion gate rejected the model.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(
                  f"mlflow_run_id={lineage['mlflow_run_id']}\n"
              )

          print("Git commit:", lineage["git_commit_sha"])
          print("MLflow Run ID:", lineage["mlflow_run_id"])
          print("Model version:", lineage["model_version"])
          PY

      - name: Upload lineage artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-lineage
          path: lineage.json
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/churn-api:${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            MLFLOW_RUN_ID=${{ steps.lineage.outputs.mlflow_run_id }}

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.63.0 image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            local/churn-api:${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        run: |
          docker tag \
            local/churn-api:${{ github.sha }} \
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Push image to GHCR
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Print image lineage
        run: |
          echo "Image: ${{ steps.image.outputs.name }}:${{ github.sha }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "MLflow Run ID: ${{ steps.lineage.outputs.mlflow_run_id }}"
